name: CI

# Quality gate for every change. Keeps future code from breaking existing
# behavior: type errors, lint violations, build failures, and failing tests
# (small / integrated / large) all block the merge.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: delivery branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require a story or bug code in the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ (^|[-_/])(story|bug)-[0-9]{3}([-_/]|$) ]]; then
            echo "Pull-request branch '$HEAD_REF' must include STORY-### or BUG-### (for example, story-015-data-integrity)."
            exit 1
          fi

  verify:
    name: typecheck · lint · build · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test (small · integrated · large)
        run: bun run test
